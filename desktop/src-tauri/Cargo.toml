[package]
name = "noosphere-desktop"
version = "0.5.0"
description = "Noosphere Desktop"
authors = ["Noosphere"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.tauri-winres]
FileDescription = "Noosphere Desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release binary size optimization: LTO + single codegen unit + size-oriented opt + symbol strip
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
