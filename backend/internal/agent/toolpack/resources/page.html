<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>{{.Title}}</title><style>*{box-sizing:border-box}body{margin:0 auto;max-width:64rem;padding:clamp(1.5rem,6vw,6rem);color:#20354B;background:#fff;font:1.08rem/1.7 system-ui,sans-serif}h1{font-size:clamp(2rem,5vw,4.5rem);line-height:1.1;margin:0 0 2rem}h2{font-size:1.55rem;color:#007A73;margin:2rem 0 .5rem}section{border-top:1px solid #d6e3e9}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{max-width:none;padding:12mm}section{break-inside:avoid}}</style><main><h1>{{.Title}}</h1>{{range .Sections}}<section><h2>{{.Heading}}</h2>{{range .Paragraphs}}<p>{{.}}</p>{{end}}</section>{{end}}</main></html>
