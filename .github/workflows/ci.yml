name: Desktop delivery

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Choose desktop platforms for preview (formal packages require all)
        type: choice
        default: all
        options:
          - all
          - windows-linux
      formal:
        description: Build signed macOS candidates from the selected release tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}-${{ inputs.formal || false }}-${{ inputs.platforms || 'all' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DELIVERY_PLATFORMS: ${{ inputs.platforms || 'all' }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      unix_matrix: ${{ steps.select.outputs.unix_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/build-config/.node-version
      - id: select
        name: Select native delivery targets
        env:
          FORMAL: ${{ inputs.formal || false }}
        run: |
          node --input-type=module >> "$GITHUB_OUTPUT" <<'JS'
          import { deliveryPlan } from './scripts/desktop-release-manifest.mjs';
          const plan = deliveryPlan(process.env.DELIVERY_PLATFORMS, process.env.FORMAL === 'true');
          console.log('unix_matrix=' + JSON.stringify(plan.matrix));
          JS

  windows:
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/build-config/.node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: scripts/build-config/.python-version
          cache: pip
          cache-dependency-path: scripts/codelens-runtime/requirements-win-py314.lock
      - name: Restore Rust and distribution download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            desktop/src-tauri/target
            test/cache/rea-runtime
            test/cache/codelens-runtime
          key: ${{ runner.os }}-x64-rust-dist-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/src-tauri/Cargo.lock', 'scripts/build-config/.python-version', 'scripts/codelens-runtime/requirements-win-py314.lock', 'scripts/rea-runtime/package-lock.json', 'scripts/platform-targets.json') }}
      - name: Restore browser test runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned MSVC Rust toolchain
        working-directory: desktop
        run: rustup show
      - name: Verify release ref and run distribution regressions
        env:
          FORMAL: ${{ inputs.formal || false }}
        run: |
          node scripts/desktop.mjs check-release-ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/desktop-release-manifest.test.mjs scripts/agent-observer-regression.mjs
      - name: Initialize and verify the developer environment
        run: ./scripts/setup.ps1 -InstallBrowser
      - name: Verify isolated Windows HTML and PDF rendering
        run: |
          . ./scripts/common.ps1
          $Fixture = Join-Path $env:RUNNER_TEMP 'gowkhtmltoimage.exe'
          curl.exe --fail --location --retry 3 --silent --show-error --output $Fixture 'https://github.com/chinmay-sawant/gowkhtmltopdf/releases/download/v0.2.6/gowkhtmltoimage_0.2.6_windows_amd64.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NOOSPHERE_TEST_HTML_TOOL = $Fixture
          Invoke-NoosphereCommand (Resolve-NoosphereCommand go) @('test', '-count=1', './internal/agent/sandbox', '-run', '^TestLPACStaticCSSPreview$') (Join-Path $PWD 'backend')
          Invoke-NoosphereCommand (Resolve-NoosphereCommand go) @('test', '-count=1', './internal/agent/render', '-run', '^TestPDFiumRendersPageContent$') (Join-Path $PWD 'backend')
      - name: Prepare a standard-integrity Windows test launcher
        run: |
          # WebView2 150+ drops environment overrides from elevated hosts. Test with the
          # per-user installer's normal integrity and keep the browser profile isolated.
          $LauncherDir = Join-Path $env:RUNNER_TEMP 'noosphere-gsudo-2.6.1'
          $Archive = "$LauncherDir.zip"
          Invoke-WebRequest -Uri 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile $Archive
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash -ne '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44') {
            throw 'Unexpected gsudo test launcher hash.'
          }
          Expand-Archive -LiteralPath $Archive -DestinationPath $LauncherDir
          $Launcher = Join-Path $LauncherDir 'x64/gsudo.exe'
          $WhoAmI = Join-Path $env:SystemRoot 'System32/whoami.exe'
          $Groups = & $Launcher --direct --integrity Medium $WhoAmI /groups /fo csv /nh
          if ($LASTEXITCODE -ne 0 -or ($Groups -join "`n") -notmatch '"S-1-16-8192"') {
            throw 'Could not launch a process at Medium integrity.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NOOSPHERE_CI_GSUDO=$Launcher"
      - name: Build and package Windows x64
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Windows packaging requires native x64.' }
          ./scripts/package.ps1
      - name: Verify real GGUF smoke fixture
        run: python scripts/prepare-model-smoke.py
      - name: Verify installed app, in-place upgrade, uninstall, and reinstall
        run: |
          $Version = (Get-Content -LiteralPath 'scripts/build-config/VERSION' -Raw).Trim()
          $PowerShell = (Get-Process -Id $PID).Path
          $PreviousArgs = @()
          if ($Version -eq '1.0.2') {
            $Prior = Join-Path $env:RUNNER_TEMP 'Noosphere-1.0.1-windows-x64-setup.exe'
            curl.exe --fail --location --retry 3 --silent --show-error --connect-timeout 30 --output $Prior 'https://github.com/2722039978-source/Noosphere/releases/download/v1.0.1/Noosphere-1.0.1-windows-x64-setup.exe'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $PreviousArgs = @('-PreviousInstaller', $Prior, '-PreviousVersion', '1.0.1', '-PreviousSHA256', '827ae4ccd307bf75762b17b4c5afa7fe7ea8e4868db4663dd33b6a8ee9caeebe')
          }
          & $env:NOOSPHERE_CI_GSUDO --direct --integrity Medium $PowerShell -NoProfile -File ./scripts/verify-installer.ps1 -Installer "artifacts/$Version/Noosphere-$Version-windows-x64-setup.exe" @PreviousArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Go, Python, Rust, frontend and packaged native tests
        run: |
          $Version = (Get-Content -LiteralPath 'scripts/build-config/VERSION' -Raw).Trim()
          $Root = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "artifacts/$Version/Noosphere-$Version-windows-x64.zip" -DestinationPath $Root
          $Executable = @(Get-ChildItem -LiteralPath $Root -Recurse -Filter 'Noosphere.exe' -File)
          if ($Executable.Count -ne 1) { throw 'Expected exactly one portable desktop executable.' }
          ./scripts/test.ps1 -Rust -Browser -LiveRuntimeInstall
          $Backend = Join-Path $Executable[0].Directory.FullName 'bin/noosphere-backend.exe'
          python scripts/test-agent-release.py --backend $Backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-agent-delivery.py --backend $Backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Node = (Get-Command node.exe).Source
          & $env:NOOSPHERE_CI_GSUDO --direct --integrity Medium $Node scripts/verify-desktop.cjs $Executable[0].Directory.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noosphere-windows-x64
          path: |
            artifacts/*/*.zip
            artifacts/*/*-setup.exe
            artifacts/*/SHA256SUMS.txt
            artifacts/*/build-info.json
          if-no-files-found: error

  unix:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.formal && matrix.os == 'macOS' && 180 || 90 }}
    environment: ${{ inputs.formal && startsWith(github.ref, 'refs/tags/') && matrix.os == 'macOS' && 'desktop-release-signing' || 'desktop-preview' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unix_matrix) }}
    env:
      NOOSPHERE_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/build-config/.node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            test/cache/desktop/${{ matrix.target }}/*.tar.gz
            test/cache/desktop/${{ matrix.target }}/*.tar.xz
            test/cache/desktop/${{ matrix.target }}/pip
            test/cache/desktop/${{ matrix.target }}/npm
          key: ${{ matrix.target }}-${{ matrix.abi }}-${{ hashFiles('desktop/rust-toolchain.toml', 'desktop/src-tauri/Cargo.lock', 'scripts/platform-targets.json', 'scripts/codelens-runtime/*.lock', 'scripts/rea-runtime/package-lock.json') }}
      - name: Check runner, toolchain and tag
        working-directory: desktop
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          FORMAL: ${{ inputs.formal || false }}
        run: |
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          rustup show
          node ../scripts/desktop.mjs check-release-ref
      - name: Install Ubuntu 22.04 packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libreoffice-writer libreoffice-impress libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libfuse2 patchelf xz-utils xvfb xauth dbus-x11 gnome-keyring weston
      - name: Verify real GGUF smoke fixture
        run: python3 scripts/prepare-model-smoke.py
      - name: Run locked native toolchain and application tests
        env:
          NOOSPHERE_TEST_RUNTIME_INSTALL: '1'
        run: |
          node scripts/desktop.mjs setup "$NOOSPHERE_BUILD_TARGET"
          node scripts/desktop.mjs test "$NOOSPHERE_BUILD_TARGET"
          python3 scripts/test-agent-release.py --backend desktop/src-tauri/bin/noosphere-backend
          python3 scripts/test-agent-delivery.py --backend desktop/src-tauri/bin/noosphere-backend
      - name: Verify isolated Linux Word and PowerPoint rendering
        if: runner.os == 'Linux'
        working-directory: backend
        env:
          NOOSPHERE_TEST_OFFICE_RENDER: '1'
        run: go test -count=1 -v ./internal/agent/render -run '^TestInstalledOfficeRendersDocumentAndSlide$'
      - name: Package and validate a preview
        if: ${{ !inputs.formal || runner.os != 'macOS' }}
        run: node scripts/desktop.mjs package "$NOOSPHERE_BUILD_TARGET"
      - name: Package signed macOS candidate and verify final artifacts
        if: ${{ inputs.formal && startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/desktop-ci-sign.mjs "$NOOSPHERE_BUILD_TARGET"
      - name: Boot relocated Debian package offline under X11
        if: runner.os == 'Linux'
        run: |
          version="$(cat scripts/build-config/VERSION)"
          node_path="$(command -v node)"
          xvfb-run -a dbus-run-session -- sudo --preserve-env=DISPLAY,XAUTHORITY,DBUS_SESSION_BUS_ADDRESS \
            unshare --net -- "$node_path" scripts/verify-native-unix.mjs "artifacts/$version/$NOOSPHERE_BUILD_TARGET" \
            --linux-netns "$(id -u)" "$(id -g)"
      - name: Install Debian packages and verify v1.0.1 upgrade under X11
        if: runner.os == 'Linux'
        run: bash scripts/verify-debian-upgrade.sh "artifacts/$(cat scripts/build-config/VERSION)/$NOOSPHERE_BUILD_TARGET"
      - name: Save and reload a synthetic model credential using Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          mapfile -t backends < <(dpkg-query -L noosphere-desktop | grep '/bin/noosphere-backend$')
          test "${#backends[@]}" -eq 1
          bash scripts/verify-linux-credentials.sh "${backends[0]}"
      - name: Boot packaged Linux applications in a Wayland-only session
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-wayland.sh "artifacts/$(cat scripts/build-config/VERSION)/$NOOSPHERE_BUILD_TARGET"
      - name: Boot relocated native macOS app
        if: runner.os == 'macOS'
        run: |
          version="$(cat scripts/build-config/VERSION)"
          node scripts/verify-native-unix.mjs "artifacts/$version/$NOOSPHERE_BUILD_TARGET"
      - name: Verify packaged backend in an isolated macOS Keychain
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          version="$(cat scripts/build-config/VERSION)"
          bash scripts/verify-macos-credentials.sh "artifacts/$version/$NOOSPHERE_BUILD_TARGET/Noosphere-$version-$NOOSPHERE_BUILD_TARGET.app.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noosphere-${{ matrix.target }}
          path: artifacts/*/${{ matrix.target }}/*
          if-no-files-found: error

  aggregate:
    needs: [windows, unix]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/build-config/.node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: noosphere-*
          path: verified
      - name: Verify revision, target identities and final checksums
        env:
          FORMAL: ${{ inputs.formal || false }}
        run: |
          if [[ "$FORMAL" == "true" ]]; then
            node scripts/desktop.mjs aggregate verified candidate --formal-tag "$GITHUB_REF_NAME"
          elif [[ "$DELIVERY_PLATFORMS" == "windows-linux" ]]; then
            node scripts/desktop.mjs aggregate verified candidate --windows-linux-preview
          else
            node scripts/desktop.mjs aggregate verified candidate
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.platforms == 'windows-linux' && 'noosphere-windows-linux-preview' || 'noosphere-four-target-candidate' }}
          path: candidate/*
          if-no-files-found: error
