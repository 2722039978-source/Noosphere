name: Windows delivery

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/codelens-runtime/requirements-win-py314.lock
      - name: Restore Rust and distribution download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            desktop/src-tauri/target
            test/cache/rea-runtime
            test/cache/codelens-runtime
          key: ${{ runner.os }}-x64-rust-dist-${{ hashFiles('rust-toolchain.toml', 'desktop/src-tauri/Cargo.lock', '.python-version', 'scripts/codelens-runtime/requirements-win-py314.lock', 'scripts/rea-runtime/package-lock.json') }}
      - name: Restore browser test runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned MSVC Rust toolchain
        run: rustup show
      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$Version") { throw "Tag must be v$Version" }
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable release requires a numeric release version.' }
      - name: Initialize and verify the developer environment
        run: ./scripts/setup.ps1 -InstallBrowser
      - name: Build and package Windows x64
        run: ./scripts/package.ps1
      - name: Configure WebView2 debugging for the disposable runner
        run: |
          # Elevated WebView2 hosts ignore environment debugging arguments starting with Runtime 150.
          $Policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $Port = 43873
          $Arguments = "--remote-debugging-port=$Port --remote-debugging-address=127.0.0.1"
          New-Item -Path $Policy -Force | Out-Null
          foreach ($Application in @('Noosphere.exe', 'noosphere-desktop.exe')) {
            New-ItemProperty -LiteralPath $Policy -Name $Application -Value $Arguments -PropertyType String -Force | Out-Null
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NOOSPHERE_TEST_WEBVIEW_PORT=$Port"
      - name: Run Go, Python, Rust, frontend and packaged native tests
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Root = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "artifacts/$Version/Noosphere-$Version-windows-x64.zip" -DestinationPath $Root
          $Executable = @(Get-ChildItem -LiteralPath $Root -Recurse -Filter 'Noosphere.exe' -File)
          if ($Executable.Count -ne 1) { throw 'Expected exactly one portable desktop executable.' }
          ./scripts/test.ps1 -Rust -Browser -PackagedRoot $Executable[0].Directory.FullName
      - name: Verify installed app, uninstall, and reinstall
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          ./scripts/verify-installer.ps1 -Installer "artifacts/$Version/Noosphere-$Version-windows-x64-setup.exe"
      - name: Remove WebView2 test policy
        if: always() && env.NOOSPHERE_TEST_WEBVIEW_PORT != ''
        run: |
          $Policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          Remove-ItemProperty -LiteralPath $Policy -Name 'Noosphere.exe', 'noosphere-desktop.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noosphere-windows-x64
          path: |
            artifacts/*/*.zip
            artifacts/*/*-setup.exe
            artifacts/*/SHA256SUMS.txt
            artifacts/*/build-info.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: noosphere-windows-x64
          path: verified
      - name: Verify checksums and publish tagged assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $Manifest = @(Get-ChildItem verified -Recurse -Filter SHA256SUMS.txt -File)
          if ($Manifest.Count -ne 1) { throw 'Exactly one release manifest is required.' }
          $AssetRoot = $Manifest[0].Directory.FullName
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          $Expected = @("Noosphere-$Version-windows-x64-setup.exe", "Noosphere-$Version-windows-x64.zip")
          $Seen = @{}
          foreach ($Line in Get-Content -LiteralPath $Manifest[0].FullName) {
            if ($Line -notmatch '^([a-fA-F0-9]{64})\s+\*?([^/\\]+)$') { throw 'Invalid checksum record.' }
            $Hash = $Matches[1]
            $Name = $Matches[2]
            if ($Name -notin $Expected -and $Name -ne 'build-info.json') { throw "Unexpected checksum record $Name" }
            if ($Seen.ContainsKey($Name)) { throw "Duplicate checksum record $Name" }
            $File = Join-Path $AssetRoot $Name
            if ((Get-FileHash -LiteralPath $File).Hash -ne $Hash) { throw "Hash mismatch for $Name" }
            $Seen[$Name] = $File
          }
          foreach ($Name in ($Expected + 'build-info.json')) {
            if (-not $Seen.ContainsKey($Name)) { throw "Missing $Name" }
          }
          $Assets = @($Expected | ForEach-Object { $Seen[$_] }) + @($Manifest[0].FullName, (Join-Path $AssetRoot 'build-info.json'))
          gh release create $env:GITHUB_REF_NAME @Assets --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
