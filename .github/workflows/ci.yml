name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All suites use synthetic fixtures and local mock providers. No model secrets
# or application release files are required by this workflow.
jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check and build production assets
        run: npm run build

  backend:
    name: Go tests and vet (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go tests
        run: go test -count=1 ./...
      - name: Run Go vet
        run: go vet ./...

  codelens:
    name: Python CodeLens tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/python/codelens/requirements.txt
            backend/python/codelens/requirements-dev.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/python/codelens/requirements-dev.txt
      - name: Run Python unit tests
        run: python -m unittest discover -s backend/python/codelens -p 'test_*.py' -v

  scripts:
    name: PowerShell script fixtures (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated build and development script fixtures
        shell: pwsh
        run: ./scripts/test-scripts.ps1
