name: Noosphere 1.0 Windows HTTPS inference retest

on:
  push:
    branches: [develop/noosphere-cloud-release-evidence]

permissions:
  actions: read
  contents: read

jobs:
  windows-https-model:
    runs-on: windows-2025
    environment: desktop-cloud-canary
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noosphere-windows-x64
          github-token: ${{ github.token }}
          run-id: 45232545703
          path: ${{ runner.temp }}/noosphere-preview-client
      - name: Retrieve the live endpoint from the original four-platform test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45244554470 -R "$GITHUB_REPOSITORY" -n cloud-canary-endpoint --dir "$RUNNER_TEMP/noosphere-client-origin"
          test -s "$RUNNER_TEMP/noosphere-client-origin/endpoint.txt"
      - name: Verify real remote generation and authentication rejection
        shell: bash
        env:
          CLOUD_CANARY_KEY: ${{ secrets.CLOUD_CANARY_KEY }}
        run: |
          test "$RUNNER_ARCH" = X64
          origin="$(cat "$RUNNER_TEMP/noosphere-client-origin/endpoint.txt")"
          python scripts/verify-native-cloud-canary.py verify "$RUNNER_TEMP/noosphere-preview-client" \
            "$origin" windows-x64 zip fc18629249d4dff39da3131b3527b893461e403d239527b283f9f12d40b2fa9b
